basePath: /
definitions:
  dto.AddCategoryBody:
    properties:
      id:
        type: string
      image_name:
        type: string
      name:
        type: string
    type: object
  dto.AddProductBody:
    properties:
      category_id:
        type: string
      description:
        type: string
      discount:
        type: integer
      id:
        type: string
      main_image:
        example: /images/example.png
        type: string
      name:
        type: string
      price:
        type: integer
      short:
        type: string
      specification:
        $ref: '#/definitions/dto.AdditionalSpec'
      tags:
        items:
          type: string
        type: array
    type: object
  dto.AdditionalSpec:
    properties:
      battery:
        type: string
      break:
        type: string
      charging:
        type: string
      clearance:
        type: string
      dimensions_l_w_h:
        type: string
      gear:
        type: string
      load_cap:
        type: string
      max_speed:
        type: string
      moisture_protection:
        type: string
      power_rated_max:
        type: string
      power_reserve:
        type: string
      seat_height:
        type: string
      tires:
        type: string
      torque_moment:
        type: string
      weight:
        type: string
    type: object
  dto.CategoriesResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/dto.Category'
        type: array
      total:
        type: integer
    type: object
  dto.Category:
    properties:
      id:
        type: string
      image_path:
        type: string
      name:
        type: string
      total_in_category:
        type: integer
    type: object
  dto.ErrorMessage:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  dto.JWTResponse:
    properties:
      token:
        type: string
    type: object
  dto.LoginBody:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  dto.Message:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  dto.Product:
    properties:
      category_id:
        type: string
      discount:
        type: integer
      id:
        type: string
      main_image:
        type: string
      name:
        type: string
      price:
        type: integer
      price_with_discount:
        type: integer
      short:
        type: string
      spec:
        type: string
    type: object
  dto.ProductDetail:
    properties:
      category_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      discount:
        type: integer
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/dto.ProductImage'
        type: array
      main_image:
        type: string
      name:
        type: string
      price:
        type: integer
      price_with_discount:
        type: integer
      short:
        type: string
      spec:
        type: string
      specification:
        $ref: '#/definitions/dto.Specification'
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  dto.ProductImage:
    properties:
      id:
        type: string
      image_path:
        type: string
      product_id:
        type: string
    type: object
  dto.ProductsResponse:
    properties:
      products:
        items:
          $ref: '#/definitions/dto.Product'
        type: array
      total:
        type: integer
    type: object
  dto.PutCategoryBody:
    properties:
      id:
        type: string
      image_name:
        type: string
      name:
        type: string
    type: object
  dto.Specification:
    properties:
      battery:
        type: string
      break:
        type: string
      charging:
        type: string
      clearance:
        type: string
      dimensions_l_w_h:
        type: string
      gear:
        type: string
      id:
        type: string
      load_cap:
        type: string
      max_speed:
        type: string
      moisture_protection:
        type: string
      power_rated_max:
        type: string
      power_reserve:
        type: string
      seat_height:
        type: string
      tires:
        type: string
      torque_moment:
        type: string
      weight:
        type: string
    type: object
  dto.UploadMessage:
    properties:
      code:
        type: integer
      link:
        type: string
      message:
        type: string
    type: object
  dto.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      name:
        type: string
    type: object
info:
  contact: {}
  description: Документация к API.
  title: Deller-Ev API
  version: "0.4"
paths:
  /admin/categories:
    post:
      consumes:
      - application/json
      operationId: add_category
      parameters:
      - description: Данные категории
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dto.AddCategoryBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Создать новую категорию
      tags:
      - Админ
  /admin/categories/{id}:
    delete:
      consumes:
      - application/json
      operationId: del_category
      parameters:
      - description: id категории
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Удалить категорию
      tags:
      - Админ
    put:
      consumes:
      - application/json
      operationId: put_category
      parameters:
      - description: id категории
        in: path
        name: id
        required: true
        type: string
      - description: Данные товара
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dto.PutCategoryBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ProductDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Изменить категорию
      tags:
      - Админ
  /admin/image-bind:
    post:
      consumes:
      - multipart/form-data
      description: Сохраняет картинку в статику. Прикрепляет эту картинку к товару.
      operationId: bind_picture
      parameters:
      - description: PNG изображение
        in: formData
        name: file
        required: true
        type: file
      - description: Имя изображения
        in: formData
        name: image_name
        required: true
        type: string
      - description: id товара
        in: formData
        name: product_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ProductImage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Прикрепить картинку
      tags:
      - Админ
  /admin/image-unbind:
    delete:
      consumes:
      - application/json
      description: Удаляет картинку из БД. Не трогает её в статике.
      operationId: unbind_picture
      parameters:
      - description: id изображения
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Открепить картинку
      tags:
      - Админ
  /admin/images:
    post:
      consumes:
      - multipart/form-data
      description: Сохраняет картинку в статику. Должно использоваться совместно с
        другими ручками, например добавления товара или категории.
      operationId: add_picture
      parameters:
      - description: PNG изображение
        in: formData
        name: file
        required: true
        type: file
      - description: Имя изображения
        in: formData
        name: image_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UploadMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Сохранить главную картинку
      tags:
      - Админ
  /admin/products:
    post:
      consumes:
      - application/json
      operationId: add_product
      parameters:
      - description: Данные товара
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dto.AddProductBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ProductDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Создать новый товар
      tags:
      - Админ
  /admin/products/{id}:
    delete:
      consumes:
      - application/json
      operationId: del_products
      parameters:
      - description: id товара
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Удалить товар
      tags:
      - Админ
    put:
      consumes:
      - application/json
      operationId: put_product
      parameters:
      - description: id товара
        in: path
        name: id
        required: true
        type: string
      - description: Данные товара
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dto.AddProductBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ProductDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Изменить товар
      tags:
      - Админ
  /auth/login:
    post:
      consumes:
      - application/json
      description: Вход по логину (email/name) и паролю. Возвращает JWT.
      operationId: log_in
      parameters:
      - description: Данные для входа
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dto.LoginBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.JWTResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Вход
      tags:
      - Аутентификация
  /auth/me:
    get:
      consumes:
      - application/json
      description: Возвращает информацию о своём профиле.
      operationId: me
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Мой профиль
      tags:
      - Аутентификация
  /categories:
    get:
      consumes:
      - application/json
      description: Возвращает id и имена категорий
      operationId: get_categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CategoriesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Получить все категории
      tags:
      - Товары
  /categories/{id}:
    get:
      consumes:
      - application/json
      operationId: get_products
      parameters:
      - description: id категории
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Получить все товары определённой категории
      tags:
      - Товары
  /products/{id}:
    get:
      consumes:
      - application/json
      description: Возвращает подробное описание товара и его характеристики (если
        есть)
      operationId: get_product_by_id
      parameters:
      - description: id товара
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProductDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Получить товар по id
      tags:
      - Товары
  /products/{id}/relative:
    get:
      consumes:
      - application/json
      description: Возвращает товары которые с таким же тегом, как и у входящего товара.
        Если таких нет, или их не 4 - добивает рандомными до 4ёх.
      operationId: get_products_by_tag
      parameters:
      - description: id товара
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Получить похожие товары по тегу
      tags:
      - Товары
securityDefinitions:
  BearerAuth:
    description: Введите JWT токен
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
