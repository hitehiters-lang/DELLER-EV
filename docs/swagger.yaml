info:
  contact: {}
  description: |-
    Документация к API.

    v1.11 Изменения:

    Роуты создания/возвращения товаров (/api/v1/products... и /api/v1/admin/products...) теперь возвращают ещё два дополнительных поля:

    1. **on_stock_price** (int) - цена товара **В НАЛИЧИИ**. Если равна нулю (или on_stock == false), то на фронте на странице товара не должна отображаться.

    2. **on_request_price** (int) - цена товара **НА ЗАКАЗ**. Если равна нулю (или on_request == false), то на фронте на странице товара не должна отображаться.

    Оба ценовых сегмента могут сосуществовать одновременно, либо отсутствовать. Если любая из новых цен != 0, тогда на странице товара не должна показываться обычная возвращаемая цена (price), а только те что указаны.

    Обязательно обновить админ панель на фронте! Нужно добавить в панели создания/изменения товара под переключателем В НАЛИЧИИ/ПОД ЗАКАЗ цены, как раз таки указанные сверху. Сам переключатель сделать необязательным, а вместо радиокнопки использовать флажок (чтобы можно было выбрать и то и то, а также указать и ту и ту цену)
  title: Deller-Ev API
  version: "1.11"
paths:
  /admin/cache:
    post:
      consumes:
      - application/json
      description: Переводит все категории, посты, товары и их характеристики на языки
        сайта..
      operationId: cache_all
      produces:
      - application/json
      responses:
        "200":
          description: '{"message":"Кеширование начато"}'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Кешировать переводы на всём сайте
      tags:
      - Админ
  /admin/categories:
    post:
      consumes:
      - application/json
      operationId: add_category
      parameters:
      - description: Данные категории
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dto.AddCategoryBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Создать новую категорию
      tags:
      - Админ
  /admin/categories/{id}:
    delete:
      consumes:
      - application/json
      operationId: del_category
      parameters:
      - description: id категории
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Удалить категорию
      tags:
      - Админ
    put:
      consumes:
      - application/json
      operationId: put_category
      parameters:
      - description: id категории
        in: path
        name: id
        required: true
        type: string
      - description: Данные товара
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dto.PutCategoryBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ProductDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Изменить категорию
      tags:
      - Админ
  /admin/comments/{id}:
    delete:
      consumes:
      - application/json
      description: Удаляет комментарий по id. Доступно только админам
      operationId: del_comment
      parameters:
      - description: id комментария
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Удалить комментарий
      tags:
      - Комментарии
  /admin/files:
    post:
      consumes:
      - multipart/form-data
      description: Сохраняет файл в статику. Должно использоваться совместно с другими
        ручками, например добавления руководства.
      operationId: add_file
      parameters:
      - description: Файл
        in: formData
        name: file
        type: file
      - description: Имя файла (без расширения)
        in: formData
        name: file_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UploadMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Сохранить файл
      tags:
      - Админ
  /admin/image-bind:
    post:
      consumes:
      - multipart/form-data
      description: Сохраняет картинку в статику. Прикрепляет эту картинку к товару.
      operationId: bind_picture
      parameters:
      - description: PNG изображение
        in: formData
        name: file
        required: true
        type: file
      - description: Имя изображения
        in: formData
        name: image_name
        required: true
        type: string
      - description: id товара
        in: formData
        name: product_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ProductImage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Прикрепить картинку
      tags:
      - Админ
  /admin/image-unbind:
    delete:
      consumes:
      - application/json
      description: Удаляет картинку из БД. Не трогает её в статике. Нужно для замены
        картинки товара и полного управления ими
      operationId: unbind_picture
      parameters:
      - description: id изображения
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Открепить картинку
      tags:
      - Админ
  /admin/images:
    post:
      consumes:
      - multipart/form-data
      description: Сохраняет картинку в статику. Должно использоваться совместно с
        другими ручками, например добавления товара или категории.
      operationId: add_picture
      parameters:
      - description: PNG изображение
        in: formData
        name: file
        required: true
        type: file
      - description: Имя изображения
        in: formData
        name: image_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UploadMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Сохранить главную картинку
      tags:
      - Админ
  /admin/manuals:
    post:
      consumes:
      - application/json
      description: Создаёт новое руководство в БД. Возвращает массив только с созданным
        руководством. Достуно только админу. Картинка прикрепляется через ручку главных
        картинок, как к товарам. Файл прикрепляется ручкой в админке. Файл пишется
        здесь с расширением
      operationId: add_manual
      parameters:
      - description: Данные руководства
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dto.AddManualBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ManualResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Создать новое руководство
      tags:
      - Руководства
  /admin/manuals/{slug}:
    delete:
      consumes:
      - application/json
      description: Удаляет руководство из БД. Достуно только админу.
      operationId: del_manual
      parameters:
      - description: slug руководства
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/dto.Manual'
